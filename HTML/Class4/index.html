<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <!-- <iframe src="https://en.wikipedia.org/wiki/HTML" frameborder="10" width="500" height="700"></iframe> -->

    <!-- <video src="movie.mkv" controls></video> -->

    <!-- <audio src="" controls></audio> -->

    <form>
      <h2>User Registration <i class="fa-solid fa-shapes"></i></h2>

      <div>
        <label for="Username">Username</label>
        <input type="text" id="Username" placeholder="Username" />
      </div>

      <div>
        <label for="age">Age</label>
        <input type="number" id="age" />
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email" />
      </div>

      <div>
        <label for="Mobile">Mobile</label>
        <input type="number" id="Mobile" />
      </div>

      <div>
        <label for="password">Password</label>
        <input type="password" id="password" />
      </div>

      <div>
        <label for="Gender">Gender</label><br />

        <input type="radio" id="male" name="Gender" /><label for="male"
          >male <i class="fa-solid fa-person"></i></label
        >
        <input type="radio" id="female" name="Gender" /><label for="female"
          >female <i class="fa-solid fa-person-dress"></i></label
        >
      </div>

      <div>
        <label for="FavColor">FavColor</label><br />

        <input type="checkbox" id="Blue" /><label for="Blue">Blue</label><br />
        <input type="checkbox" id="Yellow" /><label for="Yellow">Yellow</label
        ><br />
        <input type="checkbox" id="Green" /><label for="Green">Green</label
        ><br />
        <input type="checkbox" id="White" /><label for="White">White</label
        ><br />
        <input type="checkbox" id="Black" /><label for="Black">Black</label
        ><br />
      </div>

      <div>
        <label for="DOB">DOB</label>
        <input type="date">
      </div>
     
      <div>
        <label for="TOB">TOB</label>
        <input type="time">
      </div>

      <div>
        <label for="Address">Address</label>
        <textarea name="Address" id="Address"></textarea>
      </div>

      <button>Cancel</button>
      <input type="button" value="Reset">
      <input type="submit" value="Submit">
    </form>
  </body>
</html>
