
<!-- CSS units

    1px = 1px
    1pt = 1.5px
    1em = 16px
    100% = 100%
    100vh = 100% -> Viewport Height
    100vw = 100% -> Viewport width

-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- CDN -> Content Delivery Network -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Storm&display=swap"
      rel="stylesheet"
    />
    <style>
      .para {
        /* font-family: "Rubik Storm", system-ui; */
        font-weight: 500;
        font-style: italic;
        font-size: 2em;

        text-align: left;
        text-decoration: none;
        text-transform: none;
        text-shadow: 3px 1px 2px rgba(0,0,0,0.74);
      }
    </style>
  </head>
  <body>
    <p class="para">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Tenetur
      consectetur natus perferendis mollitia! Sint minus eaque porro sunt,
      cupiditate voluptatibus eum a officia corporis exercitationem quasi, quae
      voluptatum dignissimos deserunt?
    </p>
  </body>
</html>
